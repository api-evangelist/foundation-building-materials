name: Foundation Building Materials
description: >-
  Foundation Building Materials (FBM) is a leading North American distributor of
  interior building products — drywall, steel framing, acoustic ceilings, insulation,
  and complementary construction supplies — serving commercial and residential
  contractors across the United States and Canada. Headquartered in Santa Ana,
  California, FBM operates a national branch network and a unified customer
  ordering platform at myfbm.com (consolidating the legacy fbmsales.com, MyRIS,
  and MyFBM portals) along with iOS/Android mobile apps for contractors.
  In April 2025, FBM acquired KCG/Rew Materials, adding 800 employees and 45
  distribution branches across 23 states. In August 2025, Lowe's announced an
  agreement to acquire FBM. Brand families operating under FBM include FBM, RIS,
  Pacific Source, and Unified Door. FBM does not currently expose any public
  developer APIs, OpenAPI documentation, partner integration program, SDK, or
  GitHub organization — its digital surface is limited to buyer-facing
  e-commerce (search, ordering, order tracking, quick-order PDF/photo ingestion
  via "Quick Order Entry") rather than a developer/integration product.
